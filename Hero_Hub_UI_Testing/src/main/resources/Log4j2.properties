name = PropertiesConfig
property.filename = logs

# Fixed: Explicitly declare the new framework logger filters in the master appenders/loggers list
appenders = console, file
loggers = file, testng, selenium

# ==================== APPENDERS CONFIGURATION ====================
appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = [%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1} - %msg%n

appender.file.type = File
appender.file.name = LOGFILE
appender.file.fileName = ${filename}/mylogs.log
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = [%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1} - %msg%n
appender.file.append = false

# ==================== CUSTOM APPLICATIVE LOGGERS ====================
# Keeps your core automation framework engine logger tracking detailed debug milestones
logger.file.name = Log
logger.file.level = debug
logger.file.appenderRefs = file
logger.file.appenderRef.file.ref = LOGFILE

# Fixed: Intercepts and blocks verbose internal TestNG Graph processing loops
logger.testng.name = org.testng
logger.testng.level = warn
logger.testng.appenderRefs = stdout
logger.testng.appenderRef.stdout.ref = STDOUT

# Fixed: Suppresses heavy trace logs coming from internal Selenium engine processes
logger.selenium.name = org.openqa.selenium
logger.selenium.level = info
logger.selenium.appenderRefs = stdout
logger.selenium.appenderRef.stdout.ref = STDOUT

# ==================== ROOT LOGGER GLOBAL CONFIG ====================
# Fixed: Swapped global root log footprint level from debug to info to filter out general noise
rootLogger.level = info
rootLogger.appenderRefs = stdout
rootLogger.appenderRef.stdout.ref = STDOUT
